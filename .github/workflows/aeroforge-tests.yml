name: AeroForge Python tests

on:
  pull_request:
    paths:
      - 'aeroforge/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/aeroforge-tests.yml'
  push:
    branches: [main]
    paths:
      - 'aeroforge/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/aeroforge-tests.yml'

permissions:
  contents: read

concurrency:
  group: aeroforge-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q aeroforge scripts tests
      - name: Unit tests (no container runtime)
        run: python -m unittest discover -s tests -v
